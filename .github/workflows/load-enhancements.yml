name: Load dashboard enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, 'Load dashboard enhancement layer automatically') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancements script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/enhancements.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit injected script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load dashboard enhancement layer automatically'
          git push